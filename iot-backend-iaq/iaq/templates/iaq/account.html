{% extends "iaq/base.html" %}

{% block title %}IAQ - Account{% endblock %}

{% block content %}
    <p>Welcome to your account</p>
    <form method="post" action="{% url 'logout' %}" class="d-inline">
      {% csrf_token %}
      <button class="btn btn-primary" type="submit">Logout</button>
    </form>
    <button type="button" class="btn btn-primary" onclick="location.href='{% url 'devices' %}'">My devices</button>
    {% endblock %}
