name: ESP32 PlatformIO (Arduino Framework) Build

on:
  push:
    branches: [main]
    paths:
      - "/**"
      - ".github/workflows/esp32-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "iot-esp32-iaq-app/**"
      - ".github/workflows/esp32-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Toolchain/packages rarely change; a stable key is fine here.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-core-${{ hashFiles('iot-esp32-iaq-app/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-core-

      # Rolling key so the build dir re-saves every run (a static key never
      # updates), letting restore-keys pull the last build for incremental compiles.
      - uses: actions/cache@v4
        with:
          path: iot-esp32-iaq-app/.pio
          key: ${{ runner.os }}-pio-build-${{ hashFiles('iot-esp32-iaq-app/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-build-${{ hashFiles('iot-esp32-iaq-app/platformio.ini') }}-
            ${{ runner.os }}-pio-build-

      # PlatformIO requires Python to run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # Compile the firmware for the board/environment defined in platformio.ini.
      - name: Build firmware
        working-directory: iot-esp32-iaq-app
        run: pio run
