; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
;board_build.partitions = min_spiffs.csv
upload_port = COM7  ; Windows
;upload_port = /dev/ttyUSB1 ; Linux

build_unflags =
    -std=gnu++11

build_flags =
    -I include
    -std=gnu++20

build_src_flags =
    -Wall
    -Wextra
;    -Werror
    -Wshadow
    -Wconversion
    -Wsign-conversion
    -Wnull-dereference

; Downloaded automatically and stored per-project.
platform_packages =
    espressif/toolchain-xtensa-esp32s3 @ 12.2.0+20230208

;lib_ldf_mode = deep+

lib_deps =
    boschsensortec/bsec2@^1.10.2610
    boschsensortec/BME68x Sensor Library@^1.3.40408

[env:native]
platform = native
build_flags =
    -I include
    -std=gnu++20