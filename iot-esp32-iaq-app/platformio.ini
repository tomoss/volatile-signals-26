; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3
; Per-machine overrides (e.g. upload_port/monitor_port) go in platformio.local.ini,
; which is gitignored. Silently skipped if it doesn't exist.
extra_configs = platformio.local.ini

[env:esp32s3]
; PlatformIO's official "espressif32" platform is still pinned to arduino-esp32 3.20017
; (ESP-IDF v4.4.7) and hasn't tracked newer Arduino core releases. pioarduino is the
; actively-maintained community fork that does, with matching toolchain packages —
; this release pairs with arduino-esp32 3.3.9 (ESP-IDF v5.5.4).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
;board_build.partitions = min_spiffs.csv

build_unflags =
    -std=gnu++11

extra_scripts = pre:version.py

build_flags =
    -I include
    -std=gnu++20

build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wconversion
    -Wsign-conversion
    -Wnull-dereference

lib_deps =
    boschsensortec/bsec2@1.10.2610
    boschsensortec/BME68x Sensor Library@1.3.40408
    h2zero/NimBLE-Arduino@2.5.0
    olikraus/U8g2@2.36.18
    adafruit/RTClib@2.1.3

[env:native]
platform = native
test_framework = googletest
build_flags =
    -I include
    -I test/native_stubs
    -std=gnu++20